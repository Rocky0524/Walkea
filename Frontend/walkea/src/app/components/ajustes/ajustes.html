<main class="main-content">
  <header class="header-banner">
    Configuración del sistema
  </header>

  <div class="content-body">
    <div class="settings-container">
      <h3>Preferencias de la App</h3>
      
      <div class="setting-row">
        <div class="setting-info">
          <strong>Notificaciones</strong>
          <span>Avisos de baches y obras cercanas</span>
        </div>
        <input type="checkbox" checked class="toggle-switch">
      </div>
      
      <div class="setting-row">
        <div class="setting-info">
          <strong>Geolocalización en segundo plano</strong>
          <span>Mejora la precisión del mapa</span>
        </div>
        <input type="checkbox" checked class="toggle-switch">
      </div>

      <div class="setting-row">
        <div class="setting-info">
          <strong>Modo Oscuro</strong>
          <span>Cambia la apariencia visual</span>
        </div>
        <input type="checkbox" class="toggle-switch">
      </div>
      
      <hr class="divider">
      
      <button class="btn-logout">Cerrar Sesión</button>
    </div>
    </div>
</main>
