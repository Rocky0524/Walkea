<div class="layout-wrapper">
  @if (menuAbierto) {
    <button class="mobile-backdrop" type="button" aria-label="Cerrar menu" (click)="cerrarMenu()"></button>
  }

  <aside class="sidebar" [class.sidebar-open]="menuAbierto">
    <div class="sidebar-logo">
      <button class="mobile-close" type="button" aria-label="Cerrar menu" (click)="cerrarMenu()">×</button>
      <div class="logo-circle">
        <img src="logo-walkea.png" alt="Walkea Logo" class="logo-img">
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-btn" routerLink="/app/dashboard" routerLinkActive="active" (click)="cerrarMenu()">Inicio</button>
      <button class="nav-btn" routerLink="/app/mapa" routerLinkActive="active" (click)="cerrarMenu()">Mapa completo</button>
      <button class="nav-btn" routerLink="/app/mis-reportes" routerLinkActive="active" (click)="cerrarMenu()">Mis reportes</button>
      <button class="nav-btn" routerLink="/app/perfil" routerLinkActive="active" (click)="cerrarMenu()">Perfil</button>
      <button class="nav-btn" routerLink="/app/ajustes" routerLinkActive="active" (click)="cerrarMenu()">Ajustes</button>

      @if (rolUsuario === 'admin') {
        <div class="admin-divider"></div>
        <button class="nav-btn btn-admin" routerLink="/app/admin" routerLinkActive="active" (click)="cerrarMenu()">
          Panel admin
        </button>
      }
    </nav>

    <div class="sidebar-footer">
      <div class="user-avatar">👤</div>
      <span class="user-role">Rango</span>
    </div>
  </aside>

  <main class="main-content">
    <div class="mobile-topbar">
      <button class="mobile-menu-btn" type="button" aria-label="Abrir menu" (click)="toggleMenu()">☰</button>
      <div class="mobile-brand">
        <img src="logo-walkea.png" alt="Walkea Logo" class="mobile-brand-logo">
        <span>Walkea</span>
      </div>
    </div>

    <router-outlet></router-outlet>
  </main>
</div>
