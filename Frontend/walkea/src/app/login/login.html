<div class="auth-container">
  <div class="auth-header">
    <img src="/logo-walkea.png" alt="Logo Walkea" class="logo">
    <h1>Iniciar sesión</h1>
  </div>

  <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <div class="input-group">
      <input
        type="text"
        formControlName="email"
        placeholder="Correo o usuario"
        class="input-field"
        aria-label="Correo o usuario"
        aria-describedby="login-user-error">
      @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
        <span id="login-user-error" class="error-text" aria-live="polite">Introduce tu correo o tu usuario</span>
      }
    </div>

    <div class="input-group">
      <input
        type="password"
        formControlName="password"
        placeholder="Contraseña"
        class="input-field"
        aria-label="Contraseña"
        aria-describedby="login-pwd-error">
      @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
        <span id="login-pwd-error" class="error-text" aria-live="polite">Pon una contraseña válida de al menos 6 caracteres</span>
      }
    </div>

    <a routerLink="/registro" class="forgot-link">Registrarse</a>

    <div class="submit-container">
      <button type="submit" class="btn-submit">→</button>
    </div>
  </form>

  <div class="social-login">
    <button class="btn-social" aria-label="Iniciar sesión con Facebook">f</button>
    <button class="btn-social" aria-label="Iniciar sesión con Apple">A</button>
    <button class="btn-social" aria-label="Iniciar sesión con Google">G</button>
  </div>
</div>
