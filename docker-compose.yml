services:
  # Base de datos
  mysql:
    image: 'mysql:8.4'
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: 'password'
      MYSQL_DATABASE: 'walkea_db'
      MYSQL_USER: 'sail'
      MYSQL_PASSWORD: 'password'
    volumes:
      - 'walkea-mysql:/var/lib/mysql'
    networks:
      - walkea-network

  # Backend (Laravel)
  backend:
    build:
      context: ./backend/walkea
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    volumes:
      - './backend/walkea:/var/www/html'
    networks:
      - walkea-network
    depends_on:
      - mysql

  # Frontend (Angular)
  frontend:
    build:
      context: ./Frontend/walkea
      dockerfile: Dockerfile
    ports:
      - '4200:4200'
    volumes:
      - './Frontend/walkea:/app'
      - '/app/node_modules'  # Protege node_modules de ser sobrescrito por el volumen
    networks:
      - walkea-network

networks:
  walkea-network:
    driver: bridge

volumes:
  walkea-mysql:
    driver: local
