<div class="auth-container">
  <div class="auth-header">
    <img src="/logo-walkea.png" alt="Logo Walkea" class="logo">
    <h1>Iniciar sesión</h1>
  </div>

  <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <div class="input-group">
      <input type="email" formControlName="email" placeholder="Correo electrónico" class="input-field"
             aria-label="Correo electrónico" aria-describedby="login-email-error">
      @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched){
        <span id="login-email-error" class="error-text" aria-live="polite">Introduce un email valido</span>
      }

    </div>
 <div class="input-group">
  <input type="password" formControlName="password" placeholder="Contraseña" class="input-field"
         aria-label="Contraseña" aria-describedby="login-pwd-error">
  @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched){
    <span id="login-pwd-error" class="error-text" aria-live="polite">Pon una contraseña valida (min 6 letras)</span>
  }
 </div>
    
     <a routerLink="/registro" class="forgot-link">Registrarse</a>
    
    <div class="submit-container">
      <button type="submit" class="btn-submit">→</button>
    </div>
  </form>
</div>
