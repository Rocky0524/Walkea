<div class="container">
  <h2>Mis Reportes Enviados</h2>
  <p>Aquí puedes ver el estado de los baches y averías que has notificado.</p>

  <table class="report-table">
    <thead>
      <tr>
        <th>Descripción</th>
        <th>Coordenadas (Lat, Lng)</th>
        <th>Estado</th>
        <th>Vida</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Ejemplo: Bache en C. Mayor</td>
        <td>41.61, 0.62</td>
        <td><span class="badge activo">Activo</span></td>

        <td>
          <button class="btn-edit">Ver</button>
          <button class="btn-delete">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
