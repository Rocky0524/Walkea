<main class="dashboard-content">
  <header class="header-banner">
    ¡Hola Walker! Hay {{ marcadores.length }} incidencias nuevas en tu ciudad.
  </header>

  <div class="content-body">
    <!-- LEFT COL: REPORTES -->
    <div class="reportes-section">
      <h3>Ultimos reportes</h3>

      <div class="reportes-list">
        <p *ngIf="marcadores.length === 0" style="color: #666;">No hay reportes recientes para mostrar.</p>
        <!-- We slice to show only the latest 3 -->
        <div class="report-card" *ngFor="let m of marcadores | slice:0:3; let i = index">
          <!-- Icon/Color based on type -->
          <div class="report-icon" [style.background-color]="getColor(i)">
          </div>
          <div class="report-info">
            <span class="report-title">{{ m.descripcion || 'Reporte' }}</span>
            <span class="report-score">5/10❤️</span>
          </div>
        </div>
      </div>

      <button class="btn-more-reports" routerLink="/app/mis-reportes">Ver mas reportes</button>
    </div>

    <!-- RIGHT COL: MAP -->
    <div class="map-section">
      <h3>Ver mapa</h3>
      <div class="mini-map-container">
        <div id="mapa-dashboard"></div>
      </div>
    </div>
  </div>

  <!-- FAB BUTTON -->
  <button class="fab-add" title="Añadir reporte" aria-label="Añadir reporte"></button>
</main>
