<div class="mapa-content">
  <header class="header-banner">
    <div>
      <p class="header-kicker">Explora la zona</p>
      <h1>Mapa completo</h1>
      <p class="header-subtitle">Consulta los reportes activos y explora el mapa completo de tu zona.</p>
    </div>
  </header>

  <div class="full-map-container">
    <div id="map"></div>
  </div>

  <button class="fab-add" title="Anadir reporte" aria-label="Anadir reporte" (click)="abrirModalReporte()"></button>

  @if (mostrarNuevoReporte) {
    <app-nuevo-reporte
      (cerrar)="cerrarModalReporte()"
      (enviar)="guardarReporte($event)">
    </app-nuevo-reporte>
  }
</div>
