<div class="modal-backdrop">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Nuevo reporte</h3>
      <button class="btn-close" (click)="cancelar()">X</button>
    </div>

    <div class="modal-body">
      <div class="seccion">
        <label>1. &iquest;Qu&eacute; has visto?</label>
        <div class="grid-tipos">
          @for (tipo of tipos; track tipo.id) {
            <button
              class="btn-tipo"
              [class.activo]="tipoSeleccionado === tipo.id"
              (click)="seleccionarTipo(tipo.id)">
              <span class="emoji">{{ tipo.icono }}</span>
              <span class="nombre">{{ tipo.nombre }}</span>
            </button>
          }
        </div>
      </div>

      <div class="seccion-row">
        <div class="seccion mitad">
          <label>2. T&iacute;tulo del marcador</label>
          <input
            type="text"
            [(ngModel)]="titulo"
            maxlength="120"
            placeholder="Ej: Farola rota frente al instituto" />
        </div>

        <div class="seccion mitad">
          <label>3. A&ntilde;ade detalles (opcional)</label>
          <textarea
            [(ngModel)]="descripcion"
            placeholder="Describe la incidencia..."></textarea>
        </div>
      </div>

      <div class="seccion">
        <label>4. Confirma la ubicaci&oacute;n</label>
        <div class="mini-map-container">
          <div id="mapa-nuevo-reporte"></div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn-enviar" (click)="enviarReporte()">Enviar reporte</button>
      <button class="btn-cancelar" (click)="cancelar()">Cancelar</button>
    </div>
  </div>
</div>
